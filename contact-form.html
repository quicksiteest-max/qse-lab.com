<form name="project-request" method="POST" action="/thank-you" accept-charset="UTF-8" data-netlify="true" netlify-honeypot="bot-field" class="rounded-3xl border border-white/10 bg-slate-950/65 p-6 shadow-[0_24px_90px_rgba(0,0,0,0.30)] backdrop-blur-md sm:p-8">
            <input type="hidden" name="form-name" value="project-request">
            <input type="hidden" name="language" value="RU" data-form-language="">
            <p class="hidden" aria-hidden="true"><label>Не заполняйте это поле: <input type="text" name="bot-field" tabindex="-1" autocomplete="off"></label></p>
            <div class="grid gap-5 sm:grid-cols-2">
              <label class="sm:col-span-2"><span class="mb-2 block text-sm font-medium text-slate-300">Ваше имя</span><input type="text" name="name" autocomplete="name" required class="w-full rounded-xl border border-slate-800 bg-slate-900 px-4 py-3.5 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-300/60 focus:ring-4 focus:ring-cyan-300/10" placeholder="Как к вам обращаться?"></label>
              <label><span class="mb-2 block text-sm font-medium text-slate-300">Email</span><input type="email" name="email" autocomplete="email" required class="w-full rounded-xl border border-slate-800 bg-slate-900 px-4 py-3.5 text-white outline-none transition placeholder:text-slate-600 focus:border-violet-300/60 focus:ring-4 focus:ring-violet-300/10" placeholder="name@example.com"></label>
              <label><span class="mb-2 block text-sm font-medium text-slate-300">Телефон</span><input type="tel" name="phone" autocomplete="tel" class="w-full rounded-xl border border-slate-800 bg-slate-900 px-4 py-3.5 text-white outline-none transition placeholder:text-slate-600 focus:border-cyan-300/60 focus:ring-4 focus:ring-cyan-300/10" placeholder="+372 ..."></label>
              <label><span class="mb-2 block text-sm font-medium text-slate-300">Тип проекта</span><select name="project_type" required class="w-full rounded-xl border border-slate-800 bg-slate-900 px-4 py-3.5 text-white outline-none transition focus:border-violet-300/60 focus:ring-4 focus:ring-violet-300/10"><option value="">Выберите вариант</option><option value="starter">Starter — одностраничный сайт</option><option value="business">Business — расширенный сайт</option><option value="premium">Premium — индивидуальный сайт</option><option value="ai-solutions">AI Solutions — стоимость по запросу</option><option value="wordpress" data-project-option>WordPress</option><option value="crm" data-project-option>CRM и AI-автоматизация</option><option value="quiz" data-project-option>Квиз или калькулятор</option><option value="other">Другое</option></select></label>
              <label><span class="mb-2 block text-sm font-medium text-slate-300">Бюджет</span><select name="budget" required class="w-full rounded-xl border border-slate-800 bg-slate-900 px-4 py-3.5 text-white outline-none transition focus:border-cyan-300/60 focus:ring-4 focus:ring-cyan-300/10"><option value="" data-project-option="chooseBudget">Выберите бюджет</option><option value="starter">Starter — от €350</option><option value="business">Business — от €700</option><option value="premium">Premium — от €1500</option><option value="ai-solutions">AI Solutions — стоимость по запросу</option><option value="discuss" data-project-option>Нужно обсудить</option></select></label>
              <p class="sm:col-span-2 -mt-2 text-xs leading-5 text-slate-400">Окончательную стоимость согласуем до начала работы.</p>
              <label class="sm:col-span-2"><span class="mb-2 block text-sm font-medium text-slate-300">Сообщение</span><textarea name="message" rows="5" class="w-full resize-y rounded-xl border border-slate-800 bg-slate-900 px-4 py-3.5 text-white outline-none transition placeholder:text-slate-600 focus:border-violet-300/60 focus:ring-4 focus:ring-violet-300/10" placeholder="Расскажите пару слов о задаче"></textarea></label>
            </div>
            <button type="submit" class="mt-6 inline-flex w-full items-center justify-center rounded-xl border border-white/15 bg-white/5 px-6 py-3.5 text-sm font-semibold text-white transition-all duration-200 hover:border-cyan-200/50 hover:bg-cyan-200 hover:text-slate-950 hover:shadow-[0_0_32px_rgba(34,211,238,0.18)] focus:outline-none focus:ring-2 focus:ring-cyan-200 focus:ring-offset-4 focus:ring-offset-slate-950 sm:w-auto">Получить консультацию</button>
          </form>
