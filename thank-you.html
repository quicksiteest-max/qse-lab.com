<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Заявка успешно отправлена в QUICKSITE EST.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#020617">
  <link rel="canonical" href="https://qse-lab.com/thank-you.html">
  <link rel="icon" type="image/svg+xml" href="assets/q-mark.svg">
  <title>Заявка отправлена — QUICKSITE EST</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f5f5f4;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 20%, rgba(139, 92, 246, 0.16), transparent 32rem),
        radial-gradient(circle at 82% 76%, rgba(34, 211, 238, 0.12), transparent 30rem),
        #020617;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    main {
      position: relative;
      width: min(92vw, 720px);
      padding: clamp(2rem, 7vw, 4.5rem);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      background: rgba(15, 23, 42, 0.72);
      box-shadow: 0 32px 120px rgba(0,0,0,.48), 0 0 60px rgba(34,211,238,.06);
      text-align: center;
      backdrop-filter: blur(20px);
    }

    .languages {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      display: flex;
      gap: .25rem;
      padding: .25rem;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      background: rgba(2,6,23,.55);
    }

    .languages button {
      min-width: 2.45rem;
      padding: .45rem .6rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #94a3b8;
      font: inherit;
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }

    .languages button[aria-pressed="true"] {
      background: #a5f3fc;
      color: #0f172a;
      box-shadow: 0 0 22px rgba(165,243,252,.22);
    }

    .mark {
      width: 76px;
      height: 76px;
      margin: 1rem auto 2rem;
      display: grid;
      place-items: center;
      border: 1px solid rgba(165,243,252,.34);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(34,211,238,.18), rgba(139,92,246,.14));
      color: #a5f3fc;
      font-size: 2rem;
      box-shadow: 0 0 42px rgba(34,211,238,.15);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #c4b5fd;
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 580px;
      margin: 0 auto;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    p {
      max-width: 540px;
      margin: 1.5rem auto 0;
      color: #94a3b8;
      font-size: clamp(1rem, 2.4vw, 1.14rem);
      line-height: 1.75;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 2.25rem;
      padding: .9rem 1.35rem;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      background: rgba(255,255,255,.055);
      color: white;
      font-size: .92rem;
      font-weight: 700;
      text-decoration: none;
      transition: .22s ease;
    }

    a:hover, a:focus-visible {
      border-color: rgba(165,243,252,.62);
      background: #a5f3fc;
      color: #0f172a;
      outline: none;
      box-shadow: 0 0 34px rgba(165,243,252,.2);
      transform: translateY(-2px);
    }

    @media (max-width: 520px) {
      main { padding-top: 5.75rem; border-radius: 24px; }
      .languages { top: 1rem; right: 1rem; }
    }
  </style>
</head>
<body>
  <main>
    <div class="languages" role="group" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="et" aria-pressed="false">ET</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="mark" aria-hidden="true">✓</div>
    <div class="eyebrow" data-i18n="eyebrow">Заявка принята</div>
    <h1 data-i18n="title">Спасибо за ваше обращение</h1>
    <p data-i18n="text">Мы получили вашу заявку и свяжемся с вами в ближайшее время, чтобы обсудить проект.</p>
    <a href="/index.html#contact" data-i18n="back">Вернуться на сайт</a>
  </main>

  <script>
    (() => {
      const copy = {
        ru: {
          eyebrow: "Заявка принята",
          title: "Спасибо за ваше обращение",
          text: "Мы получили вашу заявку и свяжемся с вами в ближайшее время, чтобы обсудить проект.",
          back: "Вернуться на сайт",
          pageTitle: "Заявка отправлена — QUICKSITE EST"
        },
        et: {
          eyebrow: "Päring on vastu võetud",
          title: "Täname, et võtsite meiega ühendust",
          text: "Oleme teie päringu kätte saanud ja võtame peagi ühendust, et projekti arutada.",
          back: "Tagasi veebilehele",
          pageTitle: "Päring saadetud — QUICKSITE EST"
        },
        en: {
          eyebrow: "Request received",
          title: "Thank you for reaching out",
          text: "We’ve received your request and will contact you shortly to discuss your project.",
          back: "Return to the website",
          pageTitle: "Request sent — QUICKSITE EST"
        }
      };

      const applyLanguage = language => {
        const selected = copy[language] ? language : "ru";
        document.documentElement.lang = selected;
        document.title = copy[selected].pageTitle;
        document.querySelectorAll("[data-i18n]").forEach(element => {
          element.textContent = copy[selected][element.dataset.i18n];
        });
        document.querySelectorAll("[data-lang]").forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.lang === selected));
        });
        try { localStorage.setItem("quicksite-language", selected); } catch (error) {}
      };

      let initialLanguage = "ru";
      try { initialLanguage = localStorage.getItem("quicksite-language") || "ru"; } catch (error) {}
      applyLanguage(initialLanguage);
      document.querySelectorAll("[data-lang]").forEach(button => button.addEventListener("click", () => applyLanguage(button.dataset.lang)));
    })();
  </script>
</body>
</html>
